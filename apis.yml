name: Tilt
description: 'Tilt is a consumer fintech mobile app for building and rebuilding credit.
  It offers cash advances of up to $400, a line of credit with potential limit increases,
  and three credit cards (Essentials, Motion, and Engage), evaluating applicants from
  real-time bank-linked financial data rather than credit history alone. The app adds
  credit-score monitoring with personalized tips, customizable budgeting and spend
  tracking, AI-assisted automatic savings, and on-time-payment rewards, for an $8/month
  subscription after a 14-day trial. Tilt is a consumer application with no public
  developer API surface at this time.'
